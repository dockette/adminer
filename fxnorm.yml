# fxnorm configuration, written by `fxnorm init`.
# `fxnorm config` prints what runs and why; `fxnorm rules` lists every rule with its group.

# A Dockette Docker image repository (a Dockerfile in the root or one folder below)
presets:
  - dockette-image

# groups:              # add a group, or drop one with a leading minus
#   - -ci

# rules:               # false, true, error, warning, or options
#   common/agents-md-length: {min: 50, max: 120}
