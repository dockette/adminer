name: "Docker"

on:
  workflow_dispatch:

  pull_request:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./adminer-dg/Dockerfile
            context: .
            tag: dg
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-editor/Dockerfile
            context: .
            tag: editor
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-full/Dockerfile
            context: .
            tag: full
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-mongo/Dockerfile
            context: .
            tag: mongo
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-mssql/Dockerfile
            context: .
            tag: mssql
            platforms: linux/amd64

          - dockerfile: ./adminer-mysql/Dockerfile
            context: .
            tag: mysql
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-oracle-11/Dockerfile
            context: .
            tag: oracle-11
            platforms: linux/amd64

          - dockerfile: ./adminer-oracle-12/Dockerfile
            context: .
            tag: oracle-12
            platforms: linux/amd64

          - dockerfile: ./adminer-oracle-19/Dockerfile
            context: .
            tag: oracle-19
            platforms: linux/amd64

          - dockerfile: ./adminer-postgres/Dockerfile
            context: .
            tag: postgres
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-full/Dockerfile
            context: .
            tag: latest
            platforms: linux/amd64,linux/arm64

    name: Test (dockette/adminer:${{ matrix.tag }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: dockette/adminer:${{ matrix.tag }}-test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test PHP version
        run: |
          docker run --rm dockette/adminer:${{ matrix.tag }}-test php --version

      - name: Test HTTP server
        run: |
          CONTAINER_ID=$(docker run -d --rm -p 8080:80 dockette/adminer:${{ matrix.tag }}-test)
          trap 'docker stop $CONTAINER_ID' EXIT
          sleep 5
          curl -f http://localhost:8080 | grep -i "adminer" || (docker logs $CONTAINER_ID && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./adminer-dg/Dockerfile
            context: .
            tag: dg
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-editor/Dockerfile
            context: .
            tag: editor
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-full/Dockerfile
            context: .
            tag: full
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-mongo/Dockerfile
            context: .
            tag: mongo
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-mssql/Dockerfile
            context: .
            tag: mssql
            platforms: linux/amd64

          - dockerfile: ./adminer-mysql/Dockerfile
            context: .
            tag: mysql
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-oracle-11/Dockerfile
            context: .
            tag: oracle-11
            platforms: linux/amd64

          - dockerfile: ./adminer-oracle-12/Dockerfile
            context: .
            tag: oracle-12
            platforms: linux/amd64

          - dockerfile: ./adminer-oracle-19/Dockerfile
            context: .
            tag: oracle-19
            platforms: linux/amd64

          - dockerfile: ./adminer-postgres/Dockerfile
            context: .
            tag: postgres
            platforms: linux/amd64,linux/arm64

          - dockerfile: ./adminer-full/Dockerfile
            context: .
            tag: latest
            platforms: linux/amd64,linux/arm64

    name: Build (dockette/adminer:${{ matrix.tag }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read VERSION
        id: version
        run: cat VERSION >> "$GITHUB_OUTPUT"

      # latest is also pushed as <VERSION>, <ADMINER_VERSION> and <ADMINER_VERSION>-<VERSION>
      - name: Tags
        id: tags
        env:
          TAG: ${{ matrix.tag }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          ADMINER_VERSION: ${{ steps.version.outputs.ADMINER_VERSION }}
        run: |
          {
            echo "tags<<EOF"
            echo "dockette/adminer:$TAG"
            if [ "$TAG" = latest ]; then printf 'dockette/adminer:%s\n' "$VERSION" "$ADMINER_VERSION" "$ADMINER_VERSION-$VERSION"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to registry
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./VERSION
          gh release view "$VERSION" || gh release create "$VERSION" --generate-notes

  docs:
    name: Docs
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/adminer"
